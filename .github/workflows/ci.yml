name: Backend CI

on:
  push:
    branches: [ "main", "master", "s2"]
  pull_request:
    branches: [ "main", "master", "s2"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    
    defaults:
        run:
          working-directory: ./lessons/lr5/quiz-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./lessons/lr5/quiz-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Test Docker Build

        run: docker build -t quiz-backend:ci .